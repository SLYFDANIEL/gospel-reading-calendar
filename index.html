<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>每日讀經月曆｜一天一章</title>
  <meta name="description" content="和合本聖經每日一章接續讀經月曆">
  <style>
    :root{--cream:#f3efe4;--paper:#fffdf7;--ink:#25362d;--muted:#6f766e;--green:#315c47;--soft:#e4ece4;--gold:#b48847;--line:#dcd6c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,rgba(255,255,255,.88),transparent 35rem),var(--cream);color:var(--ink);font-family:"Noto Serif TC","Microsoft JhengHei",serif}.shell{min-height:100vh;padding:54px 28px 30px}.hero{max-width:1180px;margin:0 auto 38px;text-align:center}.eyebrow{margin:0 0 12px;color:var(--gold);font-size:13px;letter-spacing:.28em}h1{margin:0;font-size:clamp(34px,5vw,58px);font-weight:600;letter-spacing:.08em}.subtitle{margin:14px 0 0;color:var(--muted);font-size:15px;letter-spacing:.08em}.calendar{max-width:1180px;margin:auto;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:0 22px 70px rgba(54,51,39,.08)}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line)}.nav h2{margin:0;font-size:23px;letter-spacing:.08em}.nav button{width:max-content;border:0;background:transparent;color:var(--green);cursor:pointer;padding:9px 0;font:inherit}.nav button:last-child{justify-self:end}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{background:var(--green);color:#fffdf7}.week div{padding:10px;text-align:center;font-size:13px}.day{position:relative;min-height:132px;padding:13px 14px 15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}.day:nth-child(7n){border-right:0}.day:nth-last-child(-n+7){border-bottom:0}.day.out{background:#f7f4ec;color:#92968f}.day.today{background:var(--soft);box-shadow:inset 0 0 0 2px var(--gold)}.date{display:flex;justify-content:space-between;font-weight:600}.today-label{border-radius:999px;background:var(--green);color:white;padding:2px 7px;font-size:10px}.book{margin-top:20px;color:var(--green);font-size:16px;font-weight:600}.chapter{margin-top:6px;color:var(--muted);font:14px Arial,sans-serif}footer{max-width:1180px;margin:24px auto 0;color:var(--muted);text-align:center;font-size:12px}
    @media(max-width:700px){.shell{padding:28px 10px 22px}.hero{margin-bottom:24px}h1{font-size:31px}.subtitle{font-size:13px}.calendar{border-radius:15px}.nav{padding:15px 12px}.nav h2{font-size:18px}.nav button span{display:none}.week div{padding:8px 2px}.day{min-height:87px;padding:8px 5px}.date{font-size:13px}.today-label{display:none}.book{margin-top:12px;font-size:13px}.chapter{margin-top:3px;font-size:10px;white-space:nowrap}footer{padding:0 16px;line-height:1.7}}@media(max-width:380px){.shell{padding-inline:4px}.day{min-height:80px;padding-inline:3px}.chapter{font-size:9px}}
  </style>
</head>
<body>
  <main class="shell"><header class="hero"><p class="eyebrow">一天一章・接續閱讀</p><h1>每日讀經月曆</h1><p class="subtitle">從今天的進度繼續，一章一章讀完整本聖經</p></header><section class="calendar"><div class="nav"><button id="prev" aria-label="上個月">← <span>上個月</span></button><h2 id="month"></h2><button id="next" aria-label="下個月"><span>下個月</span> →</button></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid" id="grid"></div></section><footer>和合本讀經進度表・每日一章，讀完啟示錄後接續創世記</footer></main>
  <script>
    const books=[['創','創世記',50],['出','出埃及記',40],['利','利未記',27],['民','民數記',36],['申','申命記',34],['書','約書亞記',24],['士','士師記',21],['得','路得記',4],['撒上','撒母耳記上',31],['撒下','撒母耳記下',24],['王上','列王紀上',22],['王下','列王紀下',25],['代上','歷代志上',29],['代下','歷代志下',36],['拉','以斯拉記',10],['尼','尼希米記',13],['斯','以斯帖記',10],['伯','約伯記',42],['詩','詩篇',150],['箴','箴言',31],['傳','傳道書',12],['歌','雅歌',8],['賽','以賽亞書',66],['耶','耶利米書',52],['哀','耶利米哀歌',5],['結','以西結書',48],['但','但以理書',12],['何','何西阿書',14],['珥','約珥書',3],['摩','阿摩司書',9],['俄','俄巴底亞書',1],['拿','約拿書',4],['彌','彌迦書',7],['鴻','那鴻書',3],['哈','哈巴谷書',3],['番','西番雅書',3],['該','哈該書',2],['亞','撒迦利亞書',14],['瑪','瑪拉基書',4],['太','馬太福音',28],['可','馬可福音',16],['路','路加福音',24],['約','約翰福音',21],['徒','使徒行傳',28],['羅','羅馬書',16],['林前','哥林多前書',16],['林後','哥林多後書',13],['加','加拉太書',6],['弗','以弗所書',6],['腓','腓立比書',4],['西','歌羅西書',4],['帖前','帖撒羅尼迦前書',5],['帖後','帖撒羅尼迦後書',3],['提前','提摩太前書',6],['提後','提摩太後書',4],['多','提多書',3],['門','腓利門書',1],['來','希伯來書',13],['雅','雅各書',5],['彼前','彼得前書',5],['彼後','彼得後書',3],['約一','約翰一書',5],['約二','約翰二書',1],['約三','約翰三書',1],['猶','猶大書',1],['啟','啟示錄',22]];
    const chapters=books.flatMap(([short,name,count])=>Array.from({length:count},(_,i)=>({short,name,chapter:i+1})));const anchor=new Date(2026,7,31);const anchorIndex=chapters.findIndex(x=>x.name==='利未記'&&x.chapter===15);const today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1);const reading=date=>{const offset=Math.round((date-anchor)/86400000);return chapters[((anchorIndex+offset)%chapters.length+chapters.length)%chapters.length]};function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();document.querySelector('#month').textContent=`${y} 年 ${m+1} 月`;const grid=document.querySelector('#grid');grid.innerHTML='';for(let i=0;i<42;i++){const raw=i-first+1;const date=raw<1?new Date(y,m-1,prev+raw):raw>count?new Date(y,m+1,raw-count):new Date(y,m,raw);const r=reading(date),isToday=date.toDateString()===today.toDateString(),el=document.createElement('article');el.className=`day${date.getMonth()===m?'':' out'}${isToday?' today':''}`;el.setAttribute('aria-label',`${date.getMonth()+1}月${date.getDate()}日，${r.name}第${r.chapter}章`);el.innerHTML=`<div class="date"><span>${date.getDate()}</span>${isToday?'<span class="today-label">今日</span>':''}</div><div class="book">${r.short}</div><div class="chapter">第 ${r.chapter} 章</div>`;grid.appendChild(el)}}document.querySelector('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};document.querySelector('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};render();
  </script>
</body>
</html>
