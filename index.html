  <style>
    :root{--cream:#f3efe4;--paper:#fffdf7;--ink:#25362d;--muted:#6f766e;--green:#315c47;--soft:#e4ece4;--gold:#b48847;--line:#dcd6c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,rgba(255,255,255,.88),transparent 35rem),var(--cream);color:var(--ink);font-family:"Noto Serif TC","Microsoft JhengHei",serif}.shell{min-height:100vh;padding:54px 28px 30px}.hero{max-width:1180px;margin:0 auto 38px;text-align:center}.eyebrow{margin:0 0 12px;color:var(--gold);font-size:13px;letter-spacing:.28em}h1{margin:0;font-size:clamp(34px,5vw,58px);font-weight:600;letter-spacing:.08em}.subtitle{margin:14px 0 0;color:var(--muted);font-size:15px;letter-spacing:.08em}.calendar{max-width:1180px;margin:auto;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:0 22px 70px rgba(54,51,39,.08)}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line)}.nav h2{margin:0;font-size:23px;letter-spacing:.08em}.nav button{width:max-content;border:0;background:transparent;color:var(--green);cursor:pointer;padding:9px 0;font:inherit}.nav button:last-child{justify-self:end}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{background:var(--green);color:#fffdf7}.week div{padding:10px;text-align:center;font-size:13px}.day{position:relative;min-height:132px;padding:13px 14px 15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}.day:nth-child(7n){border-right:0}.day:nth-last-child(-n+7){border-bottom:0}.day.out{background:#f7f4ec;color:#92968f}.day.today{background:var(--soft);box-shadow:inset 0 0 0 2px var(--gold)}.date{display:flex;justify-content:space-between;font-weight:600}.today-label{border-radius:999px;background:var(--green);color:white;padding:2px 7px;font-size:10px}.book{margin-top:20px;color:var(--green);font-size:16px;font-weight:600}.chapter{margin-top:6px;color:var(--muted);font:14px Arial,sans-serif}footer{max-width:1180px;margin:24px auto 0;color:var(--muted);text-align:center;font-size:12px}
    @media(max-width:700px){.shell{padding:12px 6px 14px}.hero{margin-bottom:10px}h1{font-size:25px;letter-spacing:.04em}.eyebrow,.subtitle{display:none}.calendar{border-radius:15px}.nav{padding:10px 12px}.nav h2{font-size:18px}.nav button span{display:none}.week div{padding:6px 2px}.day{min-height:70px;padding:5px}.date{font-size:13px}.today-label{display:none}.book{margin-top:7px;font-size:13px}.chapter{margin-top:1px;font-size:11px;white-space:nowrap}footer{display:none}}@media(max-width:380px){.shell{padding-inline:3px}.day{min-height:66px;padding-inline:3px}.chapter{font-size:10px}}
    /* Refined reading-journal design */
    :root{--forest:#173f32;--forest2:#285a47;--cream:#f4f0e6;--paper:#fffdf7;--ink:#22332b;--muted:#748078;--gold:#c59b54;--line:#ddd8cb;--weekend:#faf6ec}
    body{background:radial-gradient(circle at 20% 0,rgba(255,255,255,.9),transparent 32rem),var(--cream);color:var(--ink)}.shell{padding:38px 24px 24px}.hero{max-width:1180px;margin:0 auto 18px;display:flex;align-items:flex-end;justify-content:space-between;text-align:left}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--forest);color:var(--gold);font-size:18px;box-shadow:0 8px 24px rgba(23,63,50,.18)}.eyebrow{margin:0 0 3px;font-size:12px;letter-spacing:.22em}.hero h1{font-size:clamp(27px,4vw,44px);letter-spacing:.05em}.today-reading{display:flex;align-items:center;gap:12px;padding:9px 14px;border:1px solid rgba(197,155,84,.45);border-radius:999px;background:rgba(255,253,247,.7);color:var(--muted);font-size:12px}.today-reading strong{color:var(--forest);font-size:18px}.calendar{border-radius:24px;box-shadow:0 24px 70px rgba(45,54,45,.1)}.nav{padding:17px 24px;background:linear-gradient(135deg,var(--forest),var(--forest2));color:white}.nav h2{font-size:21px}.nav button{border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);color:white;padding:7px 12px}.week{background:#e7eee7;color:var(--forest);border-bottom:1px solid var(--line)}.week div{padding:8px;font-size:12px;font-weight:600}.day{min-height:112px;padding:11px 12px}.day:nth-child(7n),.day:nth-child(7n+1){background:var(--weekend)}.day.out{color:#a1a59f;background:#f3f0e8}.day.today{background:#f3ead7}.date{font-size:15px}.reading{display:flex;align-items:baseline;gap:7px;margin-top:25px;color:var(--forest);font-size:17px}.reading strong{font:600 20px Arial,sans-serif;color:var(--gold)}footer{margin-top:16px;font-size:11px}
    @media(max-width:700px){.shell{padding:10px 5px}.hero{display:flex;align-items:center;margin-bottom:9px;padding:0 7px}.brand{gap:8px}.mark{width:30px;height:30px;font-size:13px}.eyebrow{display:block;font-size:9px;margin-bottom:1px}.hero h1{font-size:20px;letter-spacing:.02em}.today-reading{display:block;padding:5px 9px;border-radius:12px;text-align:center}.today-reading span{display:block;font-size:8px}.today-reading strong{font-size:14px}.calendar{border-radius:18px}.nav{padding:9px 10px}.nav h2{font-size:17px}.nav button{border:0;background:transparent;padding:5px}.week div{padding:5px 2px;font-size:11px}.day{min-height:67px;padding:5px}.date{font-size:12px}.reading{gap:4px;margin-top:9px;font-size:13px}.reading strong{font-size:15px}}
    @media(max-width:380px){.shell{padding-inline:3px}.mark{display:none}.hero h1{font-size:19px}.day{min-height:64px;padding-inline:4px}.reading{gap:3px}}
    /* Twelve seasonal palettes: clear weekends, outside dates, and chapter numbers */
    body{--dark:#173f32;--mid:#285a47;--accent:#c58c36;--season-bg:#f4f0e6;--weekend:#f7ecd8;--motif:"✦"}
    body[data-month="1"]{--dark:#334b58;--mid:#607c88;--accent:#c07a5a;--season-bg:#e8eff1;--weekend:#dbe8ed;--motif:"❄"}body[data-month="2"]{--dark:#34495e;--mid:#6c8194;--accent:#9d6f86;--season-bg:#eef1f5;--weekend:#e1e7ef;--motif:"❄"}body[data-month="3"]{--dark:#315b45;--mid:#63866d;--accent:#d1818e;--season-bg:#edf4e9;--weekend:#e1efdc;--motif:"✿"}body[data-month="4"]{--dark:#466246;--mid:#82956a;--accent:#c96f86;--season-bg:#f5eee8;--weekend:#f4e1e4;--motif:"✿"}body[data-month="5"]{--dark:#245943;--mid:#5e8b62;--accent:#d29a3e;--season-bg:#edf3e7;--weekend:#dfeeda;--motif:"✿"}body[data-month="6"]{--dark:#145b5a;--mid:#258582;--accent:#e08a35;--season-bg:#e8f3ef;--weekend:#d5ece6;--motif:"☀"}body[data-month="7"]{--dark:#155262;--mid:#287c85;--accent:#e1a43b;--season-bg:#e7f2f3;--weekend:#d6ebed;--motif:"☀"}body[data-month="8"]{--dark:#184d3c;--mid:#34705b;--accent:#d59b43;--season-bg:#f1eee3;--weekend:#e5eddf;--motif:"☀"}body[data-month="9"]{--dark:#624837;--mid:#9a7150;--accent:#bf663e;--season-bg:#f4eee3;--weekend:#f2dfcf;--motif:"◆"}body[data-month="10"]{--dark:#713f31;--mid:#a7683e;--accent:#d29a32;--season-bg:#f5ebdf;--weekend:#f2d9c5;--motif:"◆"}body[data-month="11"]{--dark:#553d36;--mid:#806354;--accent:#b94f3f;--season-bg:#eee8e1;--weekend:#ead8cd;--motif:"◆"}body[data-month="12"]{--dark:#2f4652;--mid:#607681;--accent:#b58656;--season-bg:#e8eef0;--weekend:#d9e5e9;--motif:"❄"}
    body{position:relative;background:radial-gradient(circle at 20% 0,rgba(255,255,255,.88),transparent 32rem),var(--season-bg);transition:background .35s ease}body::before{content:var(--motif) "  " var(--motif) "  " var(--motif);position:fixed;right:3%;top:12px;color:var(--accent);font-size:42px;letter-spacing:.3em;opacity:.1;pointer-events:none}.mark{background:var(--dark);color:var(--accent)}.eyebrow{color:var(--accent)}.today-reading{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}.today-reading strong{color:var(--dark)}.nav{background:linear-gradient(135deg,var(--dark),var(--mid))}.week{background:color-mix(in srgb,var(--mid) 13%,#fff);color:var(--dark)}.day:nth-child(7n),.day:nth-child(7n+1){background:var(--weekend)}.day.out{color:#929792;background:repeating-linear-gradient(135deg,#ececea 0,#ececea 5px,#e2e3e1 5px,#e2e3e1 7px)}.day.today{background:color-mix(in srgb,var(--accent) 18%,#fff);box-shadow:inset 0 0 0 2px var(--accent)}.reading{color:var(--dark)}.reading strong{color:var(--accent)}
  </style>

<body>
  <main class="shell"><header class="hero"><div class="brand"><span class="mark">✦</span><div><p class="eyebrow" id="mood"></p><h1>阿謙姵妤讀經月曆</h1></div></div><div class="today-reading"><span>今日進度</span><strong id="today-reading"></strong></div></header><section class="calendar"><div class="nav"><button id="prev" aria-label="上個月">← <span>上個月</span></button><h2 id="month"></h2><button id="next" aria-label="下個月"><span>下個月</span> →</button></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid" id="grid"></div></section><footer>和合本讀經進度表・每日一章，讀完啟示錄後接續創世記</footer></main>
  <script>
    const books=[['創','創世記',50],['出','出埃及記',40],['利','利未記',27],['民','民數記',36],['申','申命記',34],['書','約書亞記',24],['士','士師記',21],['得','路得記',4],['撒上','撒母耳記上',31],['撒下','撒母耳記下',24],['王上','列王紀上',22],['王下','列王紀下',25],['代上','歷代志上',29],['代下','歷代志下',36],['拉','以斯拉記',10],['尼','尼希米記',13],['斯','以斯帖記',10],['伯','約伯記',42],['詩','詩篇',150],['箴','箴言',31],['傳','傳道書',12],['歌','雅歌',8],['賽','以賽亞書',66],['耶','耶利米書',52],['哀','耶利米哀歌',5],['結','以西結書',48],['但','但以理書',12],['何','何西阿書',14],['珥','約珥書',3],['摩','阿摩司書',9],['俄','俄巴底亞書',1],['拿','約拿書',4],['彌','彌迦書',7],['鴻','那鴻書',3],['哈','哈巴谷書',3],['番','西番雅書',3],['該','哈該書',2],['亞','撒迦利亞書',14],['瑪','瑪拉基書',4],['太','馬太福音',28],['可','馬可福音',16],['路','路加福音',24],['約','約翰福音',21],['徒','使徒行傳',28],['羅','羅馬書',16],['林前','哥林多前書',16],['林後','哥林多後書',13],['加','加拉太書',6],['弗','以弗所書',6],['腓','腓立比書',4],['西','歌羅西書',4],['帖前','帖撒羅尼迦前書',5],['帖後','帖撒羅尼迦後書',3],['提前','提摩太前書',6],['提後','提摩太後書',4],['多','提多書',3],['門','腓利門書',1],['來','希伯來書',13],['雅','雅各書',5],['彼前','彼得前書',5],['彼後','彼得後書',3],['約一','約翰一書',5],['約二','約翰二書',1],['約三','約翰三書',1],['猶','猶大書',1],['啟','啟示錄',22]];
    const moods=['冬・霜枝','冬・薄雪','春・初芽','春・花雨','春・新綠','夏・日光','夏・青葉','夏・晚風','秋・初穗','秋・金葉','秋・暖木','冬・靜雪'];const chapters=books.flatMap(([short,name,count])=>Array.from({length:count},(_,i)=>({short,name,chapter:i+1})));const anchor=new Date(2026,7,31);const anchorIndex=chapters.findIndex(x=>x.name==='利未記'&&x.chapter===15);const today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1);const reading=date=>{const offset=Math.round((date-anchor)/86400000);return chapters[((anchorIndex+offset)%chapters.length+chapters.length)%chapters.length]};function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();document.body.dataset.month=m+1;document.querySelector('#mood').textContent=moods[m];document.querySelector('#month').textContent=`${y} 年 ${m+1} 月`;const grid=document.querySelector('#grid');grid.innerHTML='';for(let i=0;i<42;i++){const raw=i-first+1;const date=raw<1?new Date(y,m-1,prev+raw):raw>count?new Date(y,m+1,raw-count):new Date(y,m,raw);const r=reading(date),isToday=date.toDateString()===today.toDateString(),el=document.createElement('article');el.className=`day${date.getMonth()===m?'':' out'}${isToday?' today':''}`;el.setAttribute('aria-label',`${date.getMonth()+1}月${date.getDate()}日，${r.name}第${r.chapter}章`);el.innerHTML=`<div class="date"><span>${date.getDate()}</span>${isToday?'<span class="today-label">今日</span>':''}</div><div class="reading"><span>${r.short}</span><strong>${r.chapter}</strong></div>`;grid.appendChild(el)}}const tr=reading(today);document.querySelector('#today-reading').textContent=`${tr.short} ${tr.chapter}`;document.querySelector('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};document.querySelector('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};render();
  </script>
